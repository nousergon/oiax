name: Provider direct-linkage guard

# Thin caller — all scan behavior lives in the reusable workflow. Edit it
# there, not here: nousergon/nousergon-lib/.github/workflows/provider-linkage-guard.yml
#
# alpha-engine-config-I9295 (spine I9294 — Brian's 2026-08-29 ruling: the
# entire nous ergon system runs through the krepis router, no parallel
# setups). Baseline of pre-existing matches, if any:
# .provider-linkage-allowlist.yaml.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caller-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    uses: nousergon/nousergon-lib/.github/workflows/provider-linkage-guard.yml@27893a8c0212dc10f776ca420757b688ffe5bac2  # nousergon-lib PR371+374+377, merged 2026-08-29
