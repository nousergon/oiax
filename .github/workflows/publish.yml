name: Publish to PyPI

# Publishes to PyPI via OIDC trusted publishing on every push to main.
# Idempotent — skip-existing: true. REQUIRES a one-time PyPI trusted-publisher
# registration (project: oiax, repo: nousergon/oiax, workflow: publish.yml,
# environment: pypi).

permissions:
  contents: read

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.11"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist + wheel
        run: python -m build

      - name: Verify artifacts
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/oiax/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.11"

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247
        with:
          skip-existing: true

  release:
    # A published version with no matching source ref leaves a consumer who pins
    # it nothing to read and nothing to diff. This job is idempotent: it exits
    # quietly when the tag already exists, so a re-run or a no-version-change
    # push to main is a no-op rather than a failure.
    name: Tag + GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - name: Read version
        id: v
        run: |
          python -c "import tomllib,pathlib;print('version='+tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])" >> "$GITHUB_OUTPUT"

      - name: Create tag + release if absent
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then echo "tag v${VERSION} exists — nothing to do"; exit 0; fi
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
          gh release create "v${VERSION}" --title "v${VERSION}" --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md) for what changed. Published to PyPI as \`oiax==${VERSION}\`." 
