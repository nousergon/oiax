name: CI

# pytest + lint + secrets scan. Public repos get free unlimited GHA.

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # --cov-fail-under is a RATCHET: raise it when a change earns it, never
      # lower it to make a regression pass. Measured 75% on 2026-08-03; the floor
      # sits at 70% so an unrelated refactor does not red the build on rounding,
      # and a real drop still fails. Coverage that is measured and discarded
      # (which is what this job did before) reports a number nobody defends.
      - name: Run pytest
        run: python -m pytest -q --cov=oiax --cov-report=term-missing --cov-fail-under=70

  lint:
    name: Lint + type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff
        run: ruff check src/ tests/

      - name: Run mypy
        run: mypy src/oiax

  gitleaks:
    name: Secret scan
    uses: nousergon/nousergon-lib/.github/workflows/gitleaks-scan.yml@549b3c9cbeac49ab660e5f0d1f023fcde245e23e
    secrets: inherit
    permissions:
      contents: read
      security-events: write
