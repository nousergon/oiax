[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oiax"
version = "0.3.1"
description = "oiax — semantic policy routing for agent fleets. Delivers the right governance context to the right agent at the right turn, by meaning."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Brian McMahon" }]
license = { text = "MIT" }
keywords = ["agent", "policy-routing", "governance", "semantic-search", "normative-text"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastembed>=0.8.0",
    "scikit-learn>=1.3",
]

[project.urls]
Homepage = "https://github.com/nousergon/oiax"
Repository = "https://github.com/nousergon/oiax"
Issues = "https://github.com/nousergon/oiax/issues"

[project.scripts]
oiax-mcp = "oiax.adapters.mcp:main"

[project.optional-dependencies]
# The MCP server is an optional extra, not a core dependency: the Claude Code
# hook path runs on every prompt and should not import an MCP stack it never
# uses. `pip install oiax[mcp]` adds it.
mcp = ["mcp>=2.0.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.4",
    "mcp>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.mypy]
# ANALYSIS target, not the supported runtime floor — `requires-python` above still
# declares >= 3.11 and CI runs pytest on 3.11/3.12/3.13. numpy >= 2.5 ships stubs
# written with 3.12 `type` statements, which mypy cannot PARSE under a 3.11 target:
# the error is raised inside numpy's own __init__.pyi and aborts the entire run
# ("prevented further checking"), reddening every PR regardless of its diff. Per-module
# ignore_errors does not help — parsing precedes error filtering.
python_version = "3.12"
strict = true
# sklearn + fastembed deps lack type stubs; joblib and scipy (used for
# index save/load) also ship without complete stubs
[[tool.mypy.overrides]]
module = ["sklearn.*", "numpy.*", "fastembed.*", "joblib.*", "scipy.*"]
ignore_missing_imports = true
follow_imports = "skip"
