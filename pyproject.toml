[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oiax"
version = "0.1.0"
description = "oiax — semantic policy routing for agent fleets. Delivers the right governance context to the right agent at the right turn, by meaning."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Brian McMahon" }]
license = { text = "AGPL-3.0" }
keywords = ["agent", "policy-routing", "governance", "semantic-search", "normative-text"]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 (AGPL-3.0)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastembed>=0.8.0",
    "scikit-learn>=1.3",
]

[project.urls]
Homepage = "https://github.com/nousergon/oiax"
Repository = "https://github.com/nousergon/oiax"
Issues = "https://github.com/nousergon/oiax/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
